name: Deploy on Server

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: true
        default: latest
        type: string
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

env:
  DEPLOY_PATH: /home/infra-edge/fuelr
  STAGING_DEPLOY_PATH: /home/infra-edge/fuelr-staging
  COMPOSE_PROD_FILE: docker-compose.prod.yml
  COMPOSE_STAGING_FILE: docker-compose.staging.yml

jobs:
  deploy-production:
    # Pushes to dev are handled by deploy-staging below; everything else
    # (main, version tags, manual dispatch targeting production) goes to prod.
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'dev')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        shell: bash
        run: |
          IMAGE_TAG_TO_DEPLOY="latest"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG_TO_DEPLOY="${{ inputs.image_tag }}"
          fi

          echo "image_tag=$IMAGE_TAG_TO_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy directory
        shell: bash
        run: mkdir -p "${{ env.DEPLOY_PATH }}"

      - name: Write .env
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          IMAGE_NAMESPACE: ${{ github.repository_owner }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Spring Mail reads this; for Resend the password is the API key.
          MAIL_PASSWORD: ${{ secrets.RESEND_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # The assisted import. Absent, the feature says it is not wired —
          # which is why nothing here fails when the secret is not set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          # Pictures for the dishes a model writes. Absent, nothing is drawn.
          HF_TOKEN: ${{ secrets.HUGGINGFACE_KEY }}
        shell: bash
        run: |
          cd "${{ env.DEPLOY_PATH }}"

          rm -f .env
          cat > .env <<EOF
          IMAGE_TAG=${IMAGE_TAG}
          IMAGE_NAMESPACE=${IMAGE_NAMESPACE}
          POSTGRES_DB=fuelr
          POSTGRES_USER=fuelr
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID}
          HF_TOKEN=${HF_TOKEN}
          EOF
          chmod 600 .env

      - name: Sync deployment compose file
        shell: bash
        run: |
          install -Dm644 docker-compose.prod.yml "${{ env.DEPLOY_PATH }}/${{ env.COMPOSE_PROD_FILE }}"

      # The runner lives on the server, and every release leaves the previous
      # images behind: the disk filled up and a deploy died mid-pull with "No
      # space left on device". Unused images and build cache go before each
      # pull; what is running is never touched, and every image is in ghcr.
      # Pulls were riding on a login somebody typed on the server once, and
      # the day it stopped working every deploy died with "denied". The job
      # signs in itself, with the token the run already holds.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make room
        shell: bash
        run: |
          docker image prune -af || true
          docker builder prune -af || true

      - name: Pull deployment images
        shell: bash
        run: |
          cd "${{ env.DEPLOY_PATH }}"
          docker compose -f "${{ env.COMPOSE_PROD_FILE }}" pull

      - name: Deploy containers
        shell: bash
        run: |
          cd "${{ env.DEPLOY_PATH }}"
          docker compose -f "${{ env.COMPOSE_PROD_FILE }}" up -d

  deploy-staging:
    # Triggers on pushes to dev (image tagged "staging"), or a manual dispatch
    # that explicitly targets staging.
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        shell: bash
        run: |
          IMAGE_TAG_TO_DEPLOY="staging"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG_TO_DEPLOY="${{ inputs.image_tag }}"
          fi

          echo "image_tag=$IMAGE_TAG_TO_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy directory
        shell: bash
        run: mkdir -p "${{ env.STAGING_DEPLOY_PATH }}"

      - name: Write .env
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          IMAGE_NAMESPACE: ${{ github.repository_owner }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          # Same Resend account as production, so the same key.
          MAIL_PASSWORD: ${{ secrets.RESEND_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Same Anthropic workspace as production. Staging reads a handful of
          # photos a month; if that ever stops being true it wants its own key
          # so the two budgets can be told apart.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          # Pictures for the dishes a model writes. Absent, nothing is drawn.
          HF_TOKEN: ${{ secrets.HUGGINGFACE_KEY }}
        shell: bash
        run: |
          cd "${{ env.STAGING_DEPLOY_PATH }}"

          rm -f .env
          cat > .env <<EOF
          IMAGE_TAG=${IMAGE_TAG}
          IMAGE_NAMESPACE=${IMAGE_NAMESPACE}
          POSTGRES_DB=fuelr_staging
          POSTGRES_USER=fuelr_staging
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID}
          HF_TOKEN=${HF_TOKEN}
          EOF
          chmod 600 .env

      - name: Sync deployment compose file
        shell: bash
        run: |
          install -Dm644 docker-compose.staging.yml "${{ env.STAGING_DEPLOY_PATH }}/${{ env.COMPOSE_STAGING_FILE }}"

      # The runner lives on the server, and every release leaves the previous
      # images behind: the disk filled up and a deploy died mid-pull with "No
      # space left on device". Unused images and build cache go before each
      # pull; what is running is never touched, and every image is in ghcr.
      # Pulls were riding on a login somebody typed on the server once, and
      # the day it stopped working every deploy died with "denied". The job
      # signs in itself, with the token the run already holds.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make room
        shell: bash
        run: |
          docker image prune -af || true
          docker builder prune -af || true

      - name: Pull deployment images
        shell: bash
        run: |
          cd "${{ env.STAGING_DEPLOY_PATH }}"
          docker compose -f "${{ env.COMPOSE_STAGING_FILE }}" pull

      - name: Deploy containers
        shell: bash
        run: |
          cd "${{ env.STAGING_DEPLOY_PATH }}"
          docker compose -f "${{ env.COMPOSE_STAGING_FILE }}" up -d
