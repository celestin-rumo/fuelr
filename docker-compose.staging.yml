services:
  frontend:
    container_name: fuelr-staging-frontend
    image: ghcr.io/${IMAGE_NAMESPACE:-celestin-rumo}/fuelr-frontend:${IMAGE_TAG:-staging}

    expose:
      - "3000"

    environment:
      JWT_SECURE_COOKIE: "true"
      NODE_ENV: production
      PORT: 3000
      # The container name, not the service name. Compose publishes the
      # service name as a network alias on every network a container joins,
      # and four projects on the shared traefik-proxy network each call theirs
      # `backend` — measured resolving to two different projects, round-robin,
      # which is where the frontend's server-side calls were going. A container
      # name is unique host-wide, so this cannot drift back whatever anyone
      # attaches to which network later.
      BACKEND_INTERNAL_URL: http://fuelr-staging-backend:8080

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fuelr-staging-frontend.rule=Host(`staging.fuelr.celestinrumo.ch`)"
      - "traefik.http.routers.fuelr-staging-frontend.entrypoints=websecure"
      - "traefik.http.routers.fuelr-staging-frontend.tls.certresolver=le"
      - "traefik.http.routers.fuelr-staging-frontend.priority=1"
      - "traefik.http.routers.fuelr-staging-frontend.middlewares=basic-auth@file"
      - "traefik.http.services.fuelr-staging-frontend.loadbalancer.server.port=3000"

    networks:
      - traefik-proxy
      - app-internal

    restart: unless-stopped

  backend:
    container_name: fuelr-staging-backend
    image: ghcr.io/${IMAGE_NAMESPACE:-celestin-rumo}/fuelr-backend:${IMAGE_TAG:-staging}

    expose:
      - "8080"

    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-fuelr_staging}
      DB_USERNAME: ${POSTGRES_USER:-fuelr_staging}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the staging .env file}
      ADMIN_EMAIL: admin@celestinrumo.ch
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in the staging .env file}
      MAIL_HOST: smtp.resend.com
      MAIL_PORT: 587
      # Fixed by the provider, like the host above: Resend's SMTP user is the
      # literal string "resend", never the sender address and never the API
      # key. Kept out of the secrets precisely because making it configurable
      # only ever produced "535 Invalid username".
      MAIL_USERNAME: resend
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set in the staging .env file}
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      MAIL_FROM: no-reply@celestinrumo.ch
      SITE_URL: https://staging.fuelr.celestinrumo.ch
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the staging .env file}
      # The session cookie must never travel outside HTTPS.
      JWT_SECURE_COOKIE: "true"

    depends_on:
      database:
        condition: service_healthy

    # No Traefik router: the API is reached through the frontend's own route
    # handlers, which is what sets the session cookie and maps backend errors
    # to messages people can read. A public API for the native client will get
    # a hostname of its own; it cannot share a path with the web app.
    labels:
      - "traefik.enable=false"

    networks:
      - app-internal

    restart: unless-stopped

    volumes:
      # Recipe photos. The database stores only the path.
      - recipe_media:/var/lib/fuelr/media

  database:
    container_name: fuelr-staging-database
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuelr_staging}
      POSTGRES_USER: ${POSTGRES_USER:-fuelr_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the staging .env file}

    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-internal

    restart: unless-stopped

volumes:
  recipe_media:
  postgres_staging_data:

networks:
  traefik-proxy:
    name: traefik-proxy
    external: true
  app-internal:
