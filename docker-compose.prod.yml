services:
  frontend:
    container_name: fuelr-frontend
    image: ghcr.io/${IMAGE_NAMESPACE:-celestin-rumo}/fuelr-frontend:${IMAGE_TAG:-latest}

    expose:
      - "3000"

    environment:
      JWT_SECURE_COOKIE: "true"
      NODE_ENV: production
      PORT: 3000
      # Named explicitly, and resolved on app-internal rather than the shared
      # proxy network: four projects on traefik-proxy each declare a service
      # called `backend`, and a Docker alias shared by several containers
      # round-robins between them. Server-side calls — the session guard among
      # them — must not be able to reach another project's API.
      BACKEND_INTERNAL_URL: http://backend:8080

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      # Both hosts on one router, as dev-portfolio does. Traefik then asks for
      # a single certificate covering both names — which is why every name in
      # the rule must resolve before the first deploy: Let's Encrypt validates
      # each one separately, and a single unresolvable name fails the whole
      # issuance, leaving even the working host on Traefik's self-signed
      # default. That is what www did here.
      - "traefik.http.routers.fuelr-frontend.rule=Host(`fuelr.celestinrumo.ch`) || Host(`www.fuelr.celestinrumo.ch`)"
      - "traefik.http.routers.fuelr-frontend.entrypoints=websecure"
      - "traefik.http.routers.fuelr-frontend.tls.certresolver=le"
      - "traefik.http.routers.fuelr-frontend.priority=1"
      - "traefik.http.services.fuelr-frontend.loadbalancer.server.port=3000"

    networks:
      - traefik-proxy
      - app-internal

    restart: unless-stopped

  backend:
    container_name: fuelr-backend
    image: ghcr.io/${IMAGE_NAMESPACE:-celestin-rumo}/fuelr-backend:${IMAGE_TAG:-latest}

    expose:
      - "8080"

    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-fuelr}
      DB_USERNAME: ${POSTGRES_USER:-fuelr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the production .env file}
      ADMIN_EMAIL: admin@celestinrumo.ch
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in the production .env file}
      MAIL_HOST: smtp.resend.com
      MAIL_PORT: 587
      # Fixed by the provider, like the host above: Resend's SMTP user is the
      # literal string "resend", never the sender address and never the API
      # key. Kept out of the secrets precisely because making it configurable
      # only ever produced "535 Invalid username".
      MAIL_USERNAME: resend
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set in the production .env file}
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      MAIL_FROM: no-reply@celestinrumo.ch
      SITE_URL: https://fuelr.celestinrumo.ch
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the production .env file}
      # The session cookie must never travel outside HTTPS.
      JWT_SECURE_COOKIE: "true"

    depends_on:
      database:
        condition: service_healthy

    # No Traefik router: the API is reached through the frontend's own route
    # handlers, which are what set the session cookie and turn backend errors
    # into messages people can read. A public API for the native client will
    # get a hostname of its own; it cannot share a path with the web app.
    labels:
      - "traefik.enable=false"

    networks:
      - app-internal

    restart: unless-stopped

    volumes:
      # Recipe photos. The database stores only the path.
      - recipe_media:/var/lib/fuelr/media

  database:
    container_name: fuelr-database
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuelr}
      POSTGRES_USER: ${POSTGRES_USER:-fuelr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the production .env file}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-internal

    restart: unless-stopped

volumes:
  recipe_media:
  postgres_data:

networks:
  traefik-proxy:
    name: traefik-proxy
    external: true
  app-internal:
