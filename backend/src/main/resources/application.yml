spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fuelr}
    username: ${DB_USERNAME:fuelr}
    password: ${DB_PASSWORD:fuelr}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  forward-headers-strategy: framework

app:
  admin:
    email: ${ADMIN_EMAIL:admin@celestinrumo.ch}
    password: ${ADMIN_PASSWORD:changeme}
