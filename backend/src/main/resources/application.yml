spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fuelr}
    username: ${DB_USERNAME:fuelr}
    password: ${DB_PASSWORD:fuelr}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

spring.servlet.multipart:
  max-file-size: 4MB
  max-request-size: 4MB

server:
  forward-headers-strategy: framework

app:
  admin:
    email: ${ADMIN_EMAIL:admin@celestinrumo.ch}
    password: ${ADMIN_PASSWORD:changeme}

  mail:
    # Resend refuses a send whose domain is not verified in its console, so
    # this address is not cosmetic: it has to be on the verified domain.
    from: ${MAIL_FROM:fuelr@localhost}

  media:
    # Mounted Docker volume. The container must be able to write here.
    dir: ${MEDIA_DIR:/var/lib/fuelr/media}

  jwt:
    # HS256 needs at least 32 bytes. The default is a development value only —
    # staging and production must set JWT_SECRET, and changing it invalidates
    # every token already issued.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-staging-and-prod}
    ttl: ${JWT_TTL:P7D}
    # Only send the cookie over HTTPS. Off in dev, where there is no TLS.
    secure-cookie: ${JWT_SECURE_COOKIE:false}
