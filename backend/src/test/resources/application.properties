# Tests have no mounted volume, so the media directory points at a temporary
# one. Production keeps the real path and keeps failing fast when it is not
# writable: a backend that cannot store photos should say so at boot rather
# than at the first upload.
app.media.dir=${java.io.tmpdir}/fuelr-test-media

# No payment provider in a test run, and a paid feature still has to be
# exercised. With this on, asking for a plan is enough to get it — which is
# exactly why it is off everywhere a real person can reach.
app.subscription.self-activate=true
