            "recipeIngredient": [
                "350 g de farine (type p\u00e2te \u00e0 pain) + 100 g pour travailler la p\u00e2te",
                "2 cuill\u00e8res \u00e0 caf\u00e9 de sel",
                "1 sachet de levure boulang\u00e8re",
                "3 cuill\u00e8res \u00e0 soupe d'huile d'olive",
                "25 cl d'eau ti\u00e8de"
            ],
            "recipeInstructions": [
                {
                    "@type": "HowToStep",
                    "text": "Mettre 350 g de farine dans un grand saladier puis ajouter successivement le sel, la levure boulang\u00e8re et l'huile d'olive."
                },
                {
                    "@type": "HowToStep",
                    "text": "Verser petit \u00e0 petit l'eau ti\u00e8de tout en m\u00e9langeant avec une cuill\u00e8re en bois."
                },
                {
                    "@type": "HowToStep",
                    "text": "Remuer longuement jusqu'\u00e0 obtention d'une p\u00e2te qui se d\u00e9tache du saladier."
                },
                {
                    "@type": "HowToStep",
                    "text": "Laisser reposer la p\u00e2te pendant 1h en couvrant le saladier avec un torchon dans un endroit chaud."
                },
                {
                    "@type": "HowToStep",
                    "text": "Apr\u00e8s le temps de repos, d\u00e9poser de la farine sur votre plan de travail y d\u00e9poser la p\u00e2te \u00e0 pizza."
                },
                {
                    "@type": "HowToStep",
                    "text": "La travailler comme on travaillerait une p\u00e2te \u00e0 pain."
                },
                {
                    "@type": "HowToStep",
                    "text": "Fa\u00e7onner votre pizza aux dimensions de votre plaque \u00e0 four o\u00f9 l'id\u00e9al, c'est de d\u00e9poser la p\u00e2te sur du papier cuisson."
                },
                {
                    "@type": "HowToStep",
                    "text": "Agr\u00e9menter votre pizza au gr\u00e8s de vos envies ou de vos restes dans le frigo."
                }
