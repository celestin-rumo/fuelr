<!doctype html>
<!-- Hand-written, unlike its neighbours: the shapes below are the ones the
     captures do not happen to contain. `image` as an array of ImageObjects is
     the third form schema.org allows, and the first entry is the one taken. -->
<html lang="fr"><head><title>Tarte aux pommes</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Tarte aux pommes",
  "recipeYield": "6 parts",
  "image": [
    { "@type": "ImageObject", "url": "photo.jpg", "width": 1200 },
    { "@type": "ImageObject", "url": "photo-huge.jpg" }
  ],
  "recipeIngredient": ["4 pommes", "200 g de farine"],
  "recipeInstructions": ["Éplucher les pommes.", "Cuire 40 min à 180 °C."]
}
</script></head><body></body></html>
