<!doctype html>
<!-- The image is an SVG: a document that executes script, served under a lying
     content type. The import has to end with a recipe and no photo. -->
<html lang="fr"><head><title>Soupe</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Soupe de courge",
  "image": "photo.svg",
  "recipeIngredient": ["1 courge", "1 oignon"],
  "recipeInstructions": ["Cuire 30 min."]
}
</script></head><body></body></html>
