services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    # Host ports are overridable from a local .env when another project on the
    # machine already holds the default. Container ports never move.
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    environment:
      # Server-to-server calls (session checks) go over the compose network by
      # service name — not the host port a browser would use.
      BACKEND_INTERNAL_URL: http://backend:8080
      # No TLS locally, so the session cookie must not be HTTPS-only.
      JWT_SECURE_COOKIE: "false"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    working_dir: /app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: fuelr-backend

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    environment:
      DB_URL: jdbc:postgresql://database:5432/fuelr
      DB_USERNAME: fuelr
      DB_PASSWORD: fuelr
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Mailpit accepts any sender; staging and production must use the
      # address verified with Resend.
      MAIL_FROM: fuelr@localhost
      # Where the browser reaches the app, so reset links in emails point
      # somewhere that resolves. Follows FRONTEND_PORT.
      SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      ADMIN_EMAIL: admin@celestinrumo.ch
      ADMIN_PASSWORD: changeme
      # No payment provider yet, and the paid features still have to be usable
      # while they are built. With this on, asking for a plan is enough to get
      # it — so it belongs here and in the test run, and nowhere else.
      APP_SUBSCRIPTION_SELF_ACTIVATE: "true"
      # From the ignored `.env`. Empty here means the assisted import says it
      # is not wired, which is a working state and not a broken one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}

    depends_on:
      database:
        condition: service_healthy

    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src

        - action: rebuild
          path: ./backend/pom.xml

    volumes:
      # Recipe photos. The database stores only the path.
      - recipe_media:/var/lib/fuelr/media

  mailpit:
    image: axllent/mailpit:latest

    container_name: fuelr-mailpit

    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  database:
    image: postgres:17

    container_name: fuelr-database

    environment:
      POSTGRES_DB: fuelr
      POSTGRES_USER: fuelr
      POSTGRES_PASSWORD: fuelr

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelr -d fuelr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  recipe_media:
  frontend_node_modules:
  postgres_data:
